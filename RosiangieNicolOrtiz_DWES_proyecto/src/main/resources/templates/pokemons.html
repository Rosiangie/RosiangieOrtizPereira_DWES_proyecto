<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
<h1>Pokemones del Demonio</h1>
<div class="pokemon-container" th:each="pokemon : ${lista}">

</div>

</html>
