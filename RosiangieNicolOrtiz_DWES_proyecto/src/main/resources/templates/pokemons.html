<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body >
<header th:insert="~{fragments/menu :: menu}"></header>
<h1>Pokemones del Demonio</h1>
<main class="pokemons">
<div  th:class="pokemon-container" th:classappend="${pokemon.getTypes().get(0)}" th:each="pokemon : ${lista}">
  <p class="pokemon-card" th:text="${pokemon.getName()}"></p>
    <h3 class="pokemon-card" th:text="${pokemon.getId()}"></h3>
    <img class="pokemon-card" th:src="${pokemon.getSprites().getFront_default()}">
    <a th:href="@{/pokemons/{id}(id=${pokemon.getId()})}">Detalle</a>
</div>
</main>
<footer th:insert="~{fragments/footer :: footer}"></footer>
</body>
</html>
